<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">StreamDiT memory-centric inference diagram</title>
  <desc id="desc">A diagram showing host memory layer streaming and context-parallel denoising across GPUs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" rx="34" fill="url(#bg)"/>
  <text x="48" y="64" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#171717">StreamDiT</text>
  <text x="48" y="96" font-family="Inter, Arial, sans-serif" font-size="15" fill="#6f6b62">Layer streaming from host memory with context-parallel denoising</text>
  <rect x="58" y="150" width="210" height="145" rx="26" fill="#ffffff" stroke="#d8d2c4"/>
  <text x="92" y="196" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#171717">Host Memory</text>
  <text x="92" y="229" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6f6b62">DiT layers</text>
  <text x="92" y="255" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6f6b62">streamed on demand</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="380" y="126" width="150" height="92" rx="20" fill="#e9efff" stroke="#bfcaff"/>
    <text x="416" y="178" font-size="17" font-weight="800" fill="#171717">GPU 0</text>
    <rect x="560" y="126" width="150" height="92" rx="20" fill="#e9fff8" stroke="#b7eadc"/>
    <text x="596" y="178" font-size="17" font-weight="800" fill="#171717">GPU 1</text>
    <rect x="470" y="250" width="150" height="92" rx="20" fill="#fff0d9" stroke="#f2d1a7"/>
    <text x="506" y="302" font-size="17" font-weight="800" fill="#171717">GPU N</text>
  </g>
  <path d="M278 222 C328 196 336 180 372 172" stroke="#2457ff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M278 222 C370 226 466 270 462 292" stroke="#2457ff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M278 222 C402 194 490 184 552 172" stroke="#2457ff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="724" y="196" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#171717">long-context video</text>
  <text x="724" y="226" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6f6b62">split temporal context</text>
  <text x="724" y="252" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6f6b62">parallel denoising windows</text>
</svg>
